name: Isolated development fixture
on:
  push:
    branches: [agent/approved-visual-guide]
    paths: [.github/workflows/workspace-fixture.yml]
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --ignore-scripts --save-exact @fontsource/chakra-petch
      - run: npm install --ignore-scripts --save-dev --save-exact @playwright/test@1.56.1
      - name: Package source and development dependencies only
        run: |
          tar -czf /tmp/pentamark-development.tar.gz src public local desktop scripts tests docs node_modules package.json package-lock.json tsconfig.json vite.config.ts index.html playwright.config.mjs
          du -h /tmp/pentamark-development.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: pentamark-development-fixture
          path: /tmp/pentamark-development.tar.gz
          retention-days: 1
