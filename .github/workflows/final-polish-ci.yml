name: Validate PentaMark 2.13 visual polish
on:
  push:
    branches: [agent/visual-acrylic]
    paths: ['.github/workflows/final-polish-ci.yml']
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify source patch and apply
        shell: bash
        run: |
          python - <<'PY'
          import base64,hashlib,lzma,pathlib,subprocess
          data=[pathlib.Path(f'scripts/final-polish-2.13-{i}.b64').read_text() for i in range(5)]
          expected='6969e013640c8de88b2dbc2934a6001f32921b1b4225d6eef8e22ba3a80b6a20'
          raw=''.join(data)
          def check(s):
            try:
              candidate=base64.b64decode(s,validate=True)
              return candidate if hashlib.sha256(candidate).hexdigest()==expected else None
            except (ValueError,base64.binascii.Error):return None
          compressed=check(raw)
          if compressed is None and len(data[2])==3899:
            # A single ASCII char was lost while transporting one of five long chunks.
            # Only accept an exact SHA-256 match; never apply an unverified candidate.
            alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
            start=data[0]+data[1]
            end=data[3]+data[4]
            for at in range(len(data[2])+1):
              for letter in alphabet:
                trial=start+data[2][:at]+letter+data[2][at:]+end
                compressed=check(trial)
                if compressed is not None:
                  print('Recovered transport char under exact checksum',at)
                  break
              if compressed is not None:break
          assert compressed is not None,'Compressed patch checksum mismatch'
          patch=lzma.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest()=='05e404169079812b5c447933d4d06afc88bc9d061dd74b4bdea46938ed9f2dc4'
          subprocess.run(['git','apply','--check'],input=patch,check=True)
          subprocess.run(['git','apply'],input=patch,check=True)
          from pathlib import Path
          # The fixture's mobile sidebar starts collapsed. Wait for the note
          # to exist, then open the navigation before requiring visibility.
          final=Path('tests/final-visual-polish.spec.mjs')
          source=final.read_text()
          old="  await expect(page.locator('.pm-note-item').first()).toBeVisible();"
          assert source.count(old)==1
          source=source.replace(old,"  await expect(page.locator('.pm-note-item').first()).toBeAttached();")
          marker="  await page.getByRole('button',{name:'Mostrar ou ocultar arquivos',exact:true}).click();\n  const note=page.locator('.pm-note-item').first();"
          assert source.count(marker)==1
          source=source.replace(marker,marker+"\n  await expect(note).toBeVisible();")
          final.write_text(source)
          # Modal dismissal can finish one RAF after Escape. A real pointer
          # focus and settled overlay is required before selecting text.
          previous=Path('tests/visual-polish.spec.mjs')
          source=previous.read_text()
          marker="  await page.keyboard.press('Escape');\n  const editor = page.getByRole('textbox', {name:'Editor Markdown em Live Preview'});"
          assert source.count(marker)==1
          source=source.replace(marker,"  await page.keyboard.press('Escape');\n  await expect(page.getByRole('dialog',{name:'Ferramentas e ações'})).not.toBeVisible();\n  const editor = page.getByRole('textbox', {name:'Editor Markdown em Live Preview'});\n  await editor.click();\n  await expect(page.locator('.pm-live-codemirror .cm-editor.cm-focused')).toBeVisible();")
          previous.write_text(source)
          # Check the same real editor focus handshake for the main visual regression.
          final=Path('tests/final-visual-polish.spec.mjs')
          source=final.read_text()
          marker="  await page.keyboard.press('Escape');\n  await page.getByRole('textbox',{name:'Editor Markdown em Live Preview'}).focus();"
          assert source.count(marker)==1
          source=source.replace(marker,"  await page.keyboard.press('Escape');\n  await expect(page.getByRole('dialog',{name:'Ferramentas e ações'})).not.toBeVisible();\n  const editor=page.getByRole('textbox',{name:'Editor Markdown em Live Preview'});\n  await editor.click();\n  await expect(page.locator('.pm-live-codemirror .cm-editor.cm-focused')).toBeVisible();\n  await editor.focus();")
          final.write_text(source)
          PY
          git diff --check
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Focused selection regressions
        run: npx playwright test --grep "selected text glows|text column stays centered"
      - run: npx playwright test
      - name: Persist only validated source to the review branch
        id: publish
        shell: bash
        run: |
          git add -A
          git rm -f scripts/final-polish-2.13-{0,1,2,3,4}.b64
          git config user.name 'PentaMark CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "feat: context path submenu, Cortex character decode and theme-matched glass"
          git push origin HEAD:agent/visual-acrylic
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pentamark-final-polish-tests
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  windows:
    needs: browser
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/visual-acrylic
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check reviewed commit
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne "${{ needs.browser.outputs.sha }}") { throw 'Branch changed after tests' }
      - run: npm ci
      - run: npm run check
      - run: npm run desktop:build -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke test the portable Windows app
        shell: pwsh
        run: ./scripts/verify-windows-app.ps1
      - run: npm run mobile:bundle
      - name: Package Windows and host distributions
        shell: pwsh
        run: |
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force release-packages | Out-Null
          Compress-Archive -Path @('Iniciar-PentaMark.bat','Iniciar-PentaMark.sh','Configurar-Acesso-Remoto-Tailscale.bat','local','local-dist','package.json','package-lock.json','README.md','CELULAR.md','LEIA-ME-Desktop.md','LICENSE') -DestinationPath "release-packages/PentaMark-$version-Pronto.zip" -CompressionLevel Optimal
          Compress-Archive -Path 'mobile-dist/*' -DestinationPath "release-packages/PentaMark-$version-Mobile-Host-Android.zip" -CompressionLevel Optimal
          $exe="desktop-dist/PentaMark-Desktop-$version-Windows.exe"
          if (!(Test-Path $exe) -or (Get-Item $exe).Length -lt 40000000) {throw 'Missing executable'}
          Get-FileHash $exe -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: PentaMark-2.13.0-Windows-and-hosts
          path: |
            desktop-dist/PentaMark-Desktop-2.13.0-Windows.exe
            release-packages/*.zip
          if-no-files-found: error
          retention-days: 7
