name: Approved workspace regression
on:
  push:
    branches: [agent/approved-visual-guide]
permissions:
  contents: read
jobs:
  browser:
    if: github.ref == 'refs/heads/agent/approved-visual-guide'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply checksum-verified refinement once
        if: hashFiles('scripts/refine-workspace.py') != ''
        run: python scripts/refine-workspace.py
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Record compiled refinement on the isolated branch
        if: hashFiles('scripts/refine-workspace.py') != ''
        run: |
          test "${GITHUB_REF}" = 'refs/heads/agent/approved-visual-guide'
          git diff --check
          git add src/features/editor/live-preview/decorations.ts src/features/workspace/WorkspacePanel.tsx src/features/workspace/approved-workspace.css
          git rm scripts/refine-workspace.py
          git config user.name 'PentaMark development'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: stabilize inline geometry, keyboard overlays and visual details'
          git push origin HEAD:agent/approved-visual-guide
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-workspace-evidence
          path: test-results/
          retention-days: 7
