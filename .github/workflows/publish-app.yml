name: Build e publicar PentaMark
on:
  push:
    branches: [main, agent/approved-visual-guide, agent/visual-acrylic, release/v2.13.3-source, release/v2.13.4-source]
    paths:
      - '.github/workflows/publish-app.yml'
      - 'package.json'
      - 'RELEASE_NOTES_*.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    name: Windows portatil e hosts
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: TypeScript e bundle do app
        run: npm run check
      - name: Regressões de edição e mapeamento Markdown
        run: npm run test:unit
      - name: Compilar aplicativo Windows portatil
        run: npm run desktop:build -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verificar inicializacao nativa no Windows
        shell: pwsh
        run: ./scripts/verify-windows-app.ps1
      - name: Compilar host Android
        run: npm run mobile:bundle
      - name: Criar os tres pacotes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content 'package.json' -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force 'release-packages' | Out-Null
          $ready = "release-packages/PentaMark-$version-Pronto.zip"
          Compress-Archive -Path @('Iniciar-PentaMark.bat', 'Iniciar-PentaMark.sh', 'Configurar-Acesso-Remoto-Tailscale.bat', 'local', 'local-dist', 'package.json', 'package-lock.json', 'README.md', 'CELULAR.md', 'LEIA-ME-Desktop.md', 'LICENSE') -DestinationPath $ready -CompressionLevel Optimal -Force
          $android = "release-packages/PentaMark-$version-Mobile-Host-Android.zip"
          Compress-Archive -Path 'mobile-dist/*' -DestinationPath $android -CompressionLevel Optimal -Force
          $exe = "desktop-dist/PentaMark-Desktop-$version-Windows.exe"
          if (!(Test-Path $exe)) { throw "Executavel nao encontrado: $exe" }
          if ((Get-Item $exe).Length -lt 40000000) { throw 'Executavel incompleto.' }
          Get-Item $exe, $ready, $android | Select-Object Name, Length | Format-Table -AutoSize
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          @{ version=$version; commit=$env:GITHUB_SHA; executable=(Split-Path $exe -Leaf); sha256=$hash; bytes=(Get-Item $exe).Length; nativeSmoke='passed' } | ConvertTo-Json | Set-Content 'release-packages/build-manifest.json' -Encoding utf8NoBOM
          Get-Content 'release-packages/build-manifest.json'
      - name: Publicar artifacts para verificacao
        uses: actions/upload-artifact@v4
        with:
          name: pentamark-windows-e-hosts
          path: |
            desktop-dist/*.exe
            release-packages/*.zip
            release-packages/build-manifest.json
          retention-days: 7
          if-no-files-found: error
      - name: Criar release e anexar pacotes
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/v2.13.3-source' || github.ref == 'refs/heads/release/v2.13.4-source'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content 'package.json' -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $notes = "RELEASE_NOTES_$version.md"
          if (!(Test-Path $notes)) { throw "Notas de versao ausentes: $notes" }
          $releases = gh release list --repo $env:GITHUB_REPOSITORY --json tagName --limit 100 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Nao foi possivel consultar releases.' }
          if ($releases.tagName -contains $tag) { Write-Host "Release $tag ja publicado."; exit 0 }
          $exe = "desktop-dist/PentaMark-Desktop-$version-Windows.exe"
          $ready = "release-packages/PentaMark-$version-Pronto.zip"
          $android = "release-packages/PentaMark-$version-Mobile-Host-Android.zip"
          gh release create $tag $exe $ready $android --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "PentaMark $tag - Interface Pentagory" --notes-file $notes --latest
          if ($LASTEXITCODE -ne 0) { throw "Falha ao publicar $tag" }
