name: Visual refinements validation
on:
  push:
    branches: [agent/visual-acrylic]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply verified visual changes once
        if: hashFiles('scripts/visual-delta.0') != ''
        run: python scripts/apply-visual-delta.py
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Record compiled source on the development branch
        if: hashFiles('scripts/visual-delta.0') != ''
        run: |
          test "${GITHUB_REF}" = 'refs/heads/agent/visual-acrylic'
          git diff --check
          git add src docs tests playwright.config.mjs
          git rm scripts/visual-delta.* scripts/apply-visual-delta.py
          git config user.name 'PentaMark development'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: redesign chrome with acrylic material and stable block editing'
          git push origin HEAD:agent/visual-acrylic
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-refinements
          path: test-results/
          retention-days: 7
