name: Visual refinements validation
on:
  push:
    branches: [agent/visual-acrylic]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/visual-refinement.spec.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-refinements
          path: test-results/
          retention-days: 7
