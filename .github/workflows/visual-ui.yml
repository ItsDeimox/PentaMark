name: Visual refinements validation
on:
  push:
    branches: [agent/visual-acrylic]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: visual-refinements-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-refinements
          path: test-results/
          retention-days: 7
