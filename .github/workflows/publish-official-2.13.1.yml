name: Publish official PentaMark v2.13.1
on:
  push:
    branches: [agent/visual-acrylic]
    paths: ['.github/workflows/publish-official-2.13.1.yml']
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Download already validated app packages
        uses: actions/download-artifact@v4
        with:
          name: pentamark-windows-e-hosts
          run-id: 39352421075
          github-token: ${{ github.token }}
          path: validated
      - name: Verify byte-identical portable app and release branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exe="validated/desktop-dist/PentaMark-Desktop-2.13.1-Windows.exe"
          echo "0956524a84c558744bac8a445ccd9cb19ab41b018d05172eb12b7e081b0ad85d  $exe" | sha256sum --check
          test "$(stat -c%s "$exe")" -eq 83507208
          test -s "validated/release-packages/PentaMark-2.13.1-Pronto.zip"
          test -s "validated/release-packages/PentaMark-2.13.1-Mobile-Host-Android.zip"
          expected="78270d6bac5204af15f8c3f01b5bb76ec373cce9"
          actual="$(gh api "repos/$GITHUB_REPOSITORY/branches/release/v2.13.1-source" --jq '.commit.sha')"
          test "$actual" = "$expected"
          python - <<'PY'
          import json,pathlib
          m=json.loads(pathlib.Path('validated/release-packages/build-manifest.json').read_text())
          assert m['version']=='2.13.1' and m['nativeSmoke']=='passed'
          assert m['sha256']=='0956524a84c558744bac8a445ccd9cb19ab41b018d05172eb12b7e081b0ad85d'
          assert m['commit']=='8ec4a7ad847e95cfb18bc3d3366a132959e121da'
          PY
      - name: Publish GitHub Release with attached Windows executable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v2.13.1"
          exe="validated/desktop-dist/PentaMark-Desktop-2.13.1-Windows.exe"
          pc="validated/release-packages/PentaMark-2.13.1-Pronto.zip"
          mobile="validated/release-packages/PentaMark-2.13.1-Mobile-Host-Android.zip"
          cat > /tmp/release-notes.md <<'NOTES'
          ## PentaMark 2.13.1 · Controles sem fundo colorido

          Atualização pontual da interface: botões, opções clicáveis, menus e arquivos selecionados deixam de ganhar um retângulo tingido por trás. A iluminação suave das bordas e o blur continuam ativos no modo Acrílico. No Flat, os controles também permanecem transparentes. A indicação do arquivo ativo continua visível pela linha lateral e pela cor do ícone.

          **Windows:** execute `PentaMark-Desktop-2.13.1-Windows.exe`, portátil, sem Node.js. Feche a versão anterior e faça backup da pasta do cofre antes de atualizar. O executável ainda não possui assinatura digital.

          Outras opções: Host para PC e Android/Termux.

          **Validação:** 80 cenários Chromium aprovados em https://github.com/ItsDeimox/PentaMark/actions/runs/39352973102; build Windows com teste real de abertura, interface e leitura/gravação de nota em https://github.com/ItsDeimox/PentaMark/actions/runs/39352421075. O SHA-256 do portátil é `0956524a84c558744bac8a445ccd9cb19ab41b018d05172eb12b7e081b0ad85d`.

          Código da branch de revisão, sem merge na main. O tag aponta a uma revisão idêntica do aplicativo com workflows alinhados aos da branch principal.
          NOTES
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
             gh release upload "$tag" "$exe" "$pc" "$mobile" --repo "$GITHUB_REPOSITORY" --clobber
          else
             gh release create "$tag" "$exe" "$pc" "$mobile" --repo "$GITHUB_REPOSITORY" --target "release/v2.13.1-source" --title "PentaMark v2.13.1 | Controles transparentes" --notes-file /tmp/release-notes.md --latest
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,tagName,assets
