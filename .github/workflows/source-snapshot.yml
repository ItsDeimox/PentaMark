name: Development source snapshot
on:
  push:
    branches: [agent/visual-acrylic]
    paths: [.github/workflows/source-snapshot.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare source archive
        shell: bash
        run: |
          git archive --format=tar.gz -o /tmp/pentamark-source.tar.gz HEAD
          tar -tzf /tmp/pentamark-source.tar.gz | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: pentamark-source-snapshot
          path: /tmp/pentamark-source.tar.gz
          if-no-files-found: error
          retention-days: 1
