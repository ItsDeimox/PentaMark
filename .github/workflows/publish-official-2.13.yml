name: Publish official PentaMark 2.13.0
on:
  push:
    branches: [agent/visual-acrylic]
    paths: ['.github/workflows/publish-official-2.13.yml']
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download tested Windows and host packages
        uses: actions/download-artifact@v4
        with:
          name: PentaMark-2.13.0-Windows-and-hosts
          run-id: 39349630378
          github-token: ${{ github.token }}
          path: validated
      - name: Verify exact executable and cleaned release source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exe='validated/desktop-dist/PentaMark-Desktop-2.13.0-Windows.exe'
          echo "3e4c03411e9e5f44c895e220aefff4c6299d95384d4edec9f1d25ed319aad314  $exe" | sha256sum --check
          test "$(stat -c%s "$exe")" -gt 40000000
          test -s 'validated/release-packages/PentaMark-2.13.0-Pronto.zip'
          test -s 'validated/release-packages/PentaMark-2.13.0-Mobile-Host-Android.zip'
          expected='79c22e1f6d2f97a1154d2a95d30eb72e0e7ce528'
          actual="$(gh api "repos/$GITHUB_REPOSITORY/branches/release/v2.13.0-source" --jq '.commit.sha')"
          test "$actual" = "$expected"
      - name: Publish release and verified files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='v2.13.0'
          source='release/v2.13.0-source'
          exe='validated/desktop-dist/PentaMark-Desktop-2.13.0-Windows.exe'
          pc='validated/release-packages/PentaMark-2.13.0-Pronto.zip'
          mobile='validated/release-packages/PentaMark-2.13.0-Mobile-Host-Android.zip'
          cat > /tmp/release-notes.md <<'NOTES'
          ## PentaMark v2.13.0

          Polimento visual: seleção de texto e bordas mais discretas, cores e blur alinhados ao tema, padrão de circuitos mais fino, centralização do documento, e correção do hover ao trocar arquivos.

          **Navegação:** Ctrl+F abre a busca de arquivos (Ctrl+P permanece como atalho compatível). Menu de contexto com Copiar caminho relativo e Copiar caminho absoluto quando disponível no Desktop. A abertura de notas agora usa decodificação de caracteres inspirada no Cortex, sem alterar o Markdown.

          **Windows:** baixe PentaMark-Desktop-2.13.0-Windows.exe. Portátil, não precisa de Node.js. Feche a versão anterior e faça backup do cofre antes de atualizar. O executável continua sem assinatura digital.

          Também disponíveis pacotes de host PC e Android/Termux.

          **Validação:** 77 testes no Chromium e build TypeScript aprovados; o executável foi iniciado em Windows com leitura e gravação de nota sintética. Evidências: https://github.com/ItsDeimox/PentaMark/actions/runs/39349630378

          A release mantém a main intacta. O tag aponta ao commit equivalente da aplicação, com workflows alinhados à branch principal.
          NOTES
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" "$exe" "$pc" "$mobile" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$exe" "$pc" "$mobile" --repo "$GITHUB_REPOSITORY" --target "$source" --title "PentaMark v2.13.0 | Visual polish" --notes-file /tmp/release-notes.md --latest
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,tagName,assets
