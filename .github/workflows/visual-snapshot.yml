name: Visual workspace snapshot
on:
  push:
    branches: [agent/visual-acrylic]
    paths: [.github/workflows/visual-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=tar.gz --output=/tmp/pentamark-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: pentamark-source
          path: /tmp/pentamark-source.tar.gz
          retention-days: 1
