name: Android offline APK

on:
  push:
    branches: [feat/android-offline, feat/android-tailscale-graphics]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install and bundle the local React application
        run: |
          npm ci
          npm run local:build
          npx cap sync android
      - name: Build APKs and run vault JVM tests
        working-directory: android
        run: bash gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Collect unsigned APK and signing tool for local signing
        run: |
          mkdir -p android-artifacts
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk android-artifacts/PentaMark-2.13.19-unsigned.apk
          signer=$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' | sort -V | tail -n 1)
          test -n "$signer"
          cp "$signer" android-artifacts/apksigner.jar
          (cd android-artifacts && sha256sum *.apk *.jar > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: PentaMark-2.13.19-unsigned-and-local-signing-tool
          path: android-artifacts/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: PentaMark-2.13.19-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise real WebView bridge offline on API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            mkdir -p android-evidence
            result=0; (cd android && bash gradlew --no-daemon :app:connectedDebugAndroidTest) || result=$?; adb logcat -d > android-evidence/logcat.txt; adb exec-out screencap -p > android-evidence/screen.png; adb exec-out run-as com.pentagory.pentamark cat files/instrumentation.png > android-evidence/webview.png || true; exit "$result"
      - name: Upload test reports and emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PentaMark-android-test-evidence
          path: |
            android/app/build/reports/
            android/app/build/test-results/
            android/app/build/outputs/androidTest-results/
            android-evidence/
          if-no-files-found: warn
