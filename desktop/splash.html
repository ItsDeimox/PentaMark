<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'">
<title>Abrindo PentaMark</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; height: 100vh; display: grid; place-content: center; justify-items: center; background: #090c0f; color: #edf4f5; font: 14px 'Segoe UI', sans-serif; -webkit-app-region: drag; }
img { width: 92px; height: 92px; animation: breathe 2s ease-in-out infinite; }
h1 { font-size: 26px; letter-spacing: .04em; margin: 20px 0 8px; }
p { color: #93a5ab; margin: 0; }
.track { width: 160px; height: 2px; margin-top: 28px; background: #203036; overflow: hidden; }
.track::after { content: ''; display: block; width: 50%; height: 100%; background: #67e7ef; animation: travel 1.5s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.05); filter: drop-shadow(0 0 14px #67e7ef40); } }
@keyframes travel { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
@media (prefers-reduced-motion: reduce) { img, .track::after { animation: none; } }
</style>
</head>
<body><img src="../public/pentamark-brand-badge.svg" alt=""><h1>PentaMark</h1><p role="status">Preparando seu espaço de escrita…</p><div class="track" aria-hidden="true"></div></body>
</html>
